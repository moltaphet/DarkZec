<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
<defs><marker id="m00ff66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ff66"/></marker><marker id="mffce73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffce73"/></marker><marker id="m8fb09d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb09d"/></marker><marker id="m6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker><marker id="mff7a6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f3a2b" stroke-width="2"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0a1f15" stroke-width="1"/></pattern></defs>
<rect width="1920" height="1080" fill="#050d09"/><rect width="1920" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="4" fill="#00ff66"/>
<text x="60" y="62" font-size="32" fill="#d8efe2" font-weight="700" text-anchor="start" >System architecture: from bid to settlement</text><text x="60" y="92" font-size="16" fill="#82ab94" font-weight="400" text-anchor="start" >What runs locally today (implemented / simulated) versus what a production deployment would add.</text>
<line x1="60" y1="112" x2="1860" y2="112" stroke="#1f5a3a" stroke-width="1"/>
<rect x="1690.2" y="44" width="170" height="20" rx="3" fill="#8fb09d"/><text x="1699.2" y="58.5" font-size="11" fill="#0d1a13" font-weight="700" text-anchor="start" >PRODUCTION · NOT BUILT</text><rect x="1596.1000000000001" y="44" width="80" height="20" rx="3" fill="#ffce73"/><text x="1605.1000000000001" y="58.5" font-size="11" fill="#2a1d00" font-weight="700" text-anchor="start" >SIMULATED</text><rect x="1488.2" y="44" width="94" height="20" rx="3" fill="#00ff66"/><text x="1497.2" y="58.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="1860" y="34" font-size="11" fill="#82ab94" font-weight="400" text-anchor="end" >LEGEND</text>
<rect x="50" y="175" width="580" height="810" rx="8" fill="#07140d" stroke="#12301f" stroke-width="1.5"/><text x="70" y="202" font-size="13" fill="#35c57a" font-weight="700" text-anchor="start" >BIDDER DEVICE · BROWSER, FULLY OFFLINE</text><rect x="690" y="175" width="500" height="810" rx="8" fill="#07140d" stroke="#12301f" stroke-width="1.5"/><text x="710" y="202" font-size="13" fill="#35c57a" font-weight="700" text-anchor="start" >WALLET + SHIELDED NETWORK</text><rect x="1270" y="175" width="600" height="810" rx="8" fill="#07140d" stroke="#12301f" stroke-width="1.5"/><text x="1290" y="202" font-size="13" fill="#35c57a" font-weight="700" text-anchor="start" >VAULT / AUCTION OPERATOR</text><rect x="75" y="215" width="530" height="150" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="91" y="227" width="94" height="20" rx="3" fill="#00ff66"/><text x="100" y="241.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="91" y="273" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >1 · Compose bid</text><text x="91" y="299" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Limit price (ZEC per lot), whole-lot quantity,</text><text x="91" y="321" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >auction ID. Exact decimal parsing: BigInt zatoshis,</text><text x="91" y="343" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >at most 8 decimals, never floating point.</text><rect x="75" y="405" width="530" height="150" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="91" y="417" width="94" height="20" rx="3" fill="#00ff66"/><text x="100" y="431.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="91" y="463" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >2 · Salt + commitment</text><text x="91" y="489" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >salt = HMAC-SHA256(32 random bytes,</text><text x="91" y="511" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >  "DARKZEC/salt/v1:" + auctionId + ":" + nonce)</text><text x="91" y="533" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >commitment = SHA-256(auctionId:price:qty:salt)</text><rect x="75" y="595" width="530" height="150" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="91" y="607" width="94" height="20" rx="3" fill="#00ff66"/><text x="100" y="621.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="91" y="653" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >3 · Memo builder</text><text x="91" y="679" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Canonical JSON {v,a,p,q,s,r}, fixed key order.</text><text x="91" y="701" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >UTF-8 length audited &lt;= 512 bytes BEFORE encoding.</text><text x="91" y="723" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Refund must be an Orchard-only UA (u1 / utest1).</text><rect x="75" y="785" width="530" height="150" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="91" y="797" width="94" height="20" rx="3" fill="#00ff66"/><text x="100" y="811.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="91" y="843" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >4 · ZIP-321 URI builder</text><text x="91" y="869" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >zcash:&lt;vault UA&gt;?amount=&lt;price x qty&gt;&amp;memo=&lt;b64url&gt;</text><text x="91" y="891" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Base64url is readable encoding, NOT encryption.</text><text x="91" y="913" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Wallet link enabled only after explicit review.</text><path d="M340 365 L340 405" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/><path d="M340 555 L340 595" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/><path d="M340 745 L340 785" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/><rect x="715" y="300" width="450" height="200" rx="6" fill="#0a1a12" stroke="#8fb09d" stroke-width="2" stroke-dasharray="2 5"/><rect x="731" y="312" width="170" height="20" rx="3" fill="#8fb09d"/><text x="740" y="326.5" font-size="11" fill="#0d1a13" font-weight="700" text-anchor="start" >PRODUCTION · NOT BUILT</text><text x="731" y="358" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Orchard-capable wallet (e.g. Zodl)</text><text x="731" y="384" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Reviews destination, network and amount.</text><text x="731" y="406" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Builds the shielded Orchard transaction and</text><text x="731" y="428" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >encrypts amount + memo into the note.</text><text x="731" y="450" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >DarkZec never holds keys, seed or funds.</text><rect x="715" y="600" width="450" height="170" rx="6" fill="#0a1a12" stroke="#8fb09d" stroke-width="2" stroke-dasharray="2 5"/><rect x="731" y="612" width="170" height="20" rx="3" fill="#8fb09d"/><text x="740" y="626.5" font-size="11" fill="#0d1a13" font-weight="700" text-anchor="start" >PRODUCTION · NOT BUILT</text><text x="731" y="658" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Zcash shielded network</text><text x="731" y="684" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Chain shows an encrypted Orchard note only:</text><text x="731" y="706" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >amount, memo and addresses are not visible.</text><text x="731" y="728" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Timing and size metadata still are.</text><path d="M605 860 L648 860 L648 400 L715 400" fill="none" stroke="#8fb09d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m8fb09d)" stroke-linejoin="round"/><text font-size="13" fill="#8fb09d" text-anchor="middle" transform="translate(664 640) rotate(-90)">URI handoff · user-reviewed</text><path d="M940 500 L940 600" fill="none" stroke="#8fb09d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m8fb09d)" stroke-linejoin="round"/><path d="M1165 685 L1215 685 L1215 320 L1295 320" fill="none" stroke="#8fb09d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m8fb09d)" stroke-linejoin="round"/><text font-size="13" fill="#8fb09d" text-anchor="middle" transform="translate(1203 520) rotate(-90)">encrypted note + memo</text><rect x="1295" y="215" width="550" height="150" rx="6" fill="#0a1a12" stroke="#ffce73" stroke-width="2" stroke-dasharray="7 5"/><rect x="1311" y="227" width="80" height="20" rx="3" fill="#ffce73"/><text x="1320" y="241.5" font-size="11" fill="#2a1d00" font-weight="700" text-anchor="start" >SIMULATED</text><text x="1311" y="273" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Vault intake</text><text x="1311" y="299" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Sandbox: memo sealed with AES-256-GCM, key not</text><text x="1311" y="321" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >extractable, 96-bit IV, AAD = commitment.</text><text x="1311" y="343" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Production: IVK holder scans incoming Orchard notes.</text><rect x="1295" y="385" width="550" height="125" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="1311" y="397" width="94" height="20" rx="3" fill="#00ff66"/><text x="1320" y="411.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="1311" y="443" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Public sealed book</text><text x="1311" y="469" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Only commitment hashes are listed (max 128 bids).</text><text x="1311" y="491" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Prices, quantities, salts, refund UAs stay sealed.</text><rect x="1295" y="530" width="550" height="125" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="1311" y="542" width="94" height="20" rx="3" fill="#00ff66"/><text x="1320" y="556.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="1311" y="588" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Close and freeze</text><text x="1311" y="614" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Submissions refused; commitment set is frozen.</text><text x="1311" y="636" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Domain-separated SHA-256 Merkle root computed.</text><rect x="1295" y="675" width="550" height="150" rx="6" fill="#0a1a12" stroke="#00ff66" stroke-width="2"/><rect x="1311" y="687" width="94" height="20" rx="3" fill="#00ff66"/><text x="1320" y="701.5" font-size="11" fill="#001a0a" font-weight="700" text-anchor="start" >IMPLEMENTED</text><text x="1311" y="733" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Unseal and clear</text><text x="1311" y="759" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Decrypt every envelope, re-verify each commitment.</text><text x="1311" y="781" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Uniform price: highest limits fill first.</text><text x="1311" y="803" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >paid = price x lots; refund = escrow - paid.</text><rect x="1295" y="845" width="550" height="125" rx="6" fill="#0a1a12" stroke="#8fb09d" stroke-width="2" stroke-dasharray="2 5"/><rect x="1311" y="857" width="170" height="20" rx="3" fill="#8fb09d"/><text x="1320" y="871.5" font-size="11" fill="#0d1a13" font-weight="700" text-anchor="start" >PRODUCTION · NOT BUILT</text><text x="1311" y="903" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Settlement</text><text x="1311" y="929" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Real payout and refund transactions to Orchard UAs.</text><text x="1311" y="951" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Here: accounting entries only, no funds move.</text><path d="M1570 365 L1570 385" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/><path d="M1570 510 L1570 530" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/><path d="M1570 655 L1570 675" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/><path d="M1570 825 L1570 845" fill="none" stroke="#8fb09d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m8fb09d)" stroke-linejoin="round"/><path d="M340 935 L340 1005 L1245 1005 L1245 265 L1295 265" fill="none" stroke="#ffce73" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#mffce73)" stroke-linejoin="round"/><text font-size="13" fill="#ffce73" text-anchor="middle" transform="translate(1257 520) rotate(-90)">sandbox shortcut</text><text x="360" y="1027" font-size="13" fill="#ffce73" font-weight="400" text-anchor="start" >Sandbox shortcut: the prepared bid goes straight into the local vault. No wallet, no chain, no funds.</text>
<line x1="60" y1="1040" x2="1860" y2="1040" stroke="#1f5a3a" stroke-width="1"/>
<text x="60" y="1066" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >DARKZEC / NODE 07  ·  ZECATHON PRIVATE MARKETS  ·  local sandbox + ZIP-321 request builder</text><text x="1860" y="1066" font-size="13" fill="#35c57a" font-weight="700" text-anchor="end" >DIAGRAM 1 / 6</text>
</svg>