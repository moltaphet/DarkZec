ext><text x="912" y="394" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >2</text><text x="1082" y="394" font-size="19" fill="#ffce73" font-weight="700" text-anchor="end" >2</text><text x="1312" y="394" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >1.36</text><text x="1512" y="394" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >2.72</text><text x="1576" y="394" font-size="15" fill="#ffce73" font-weight="700" text-anchor="start" >partial fill: sets the price</text><rect x="60" y="414" width="1800" height="54" fill="#0a1a12" stroke="#1f5a3a" stroke-width="1"/><rect x="60" y="414" width="6" height="54" fill="#ff7a6b"/><text x="76" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="start" >4</text><text x="312" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >0.59</text><text x="482" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >5</text><text x="652" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >2.95</text><text x="912" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >0</text><text x="1082" y="448" font-size="19" fill="#ff7a6b" font-weight="700" text-anchor="end" >0</text><text x="1312" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >0</text><text x="1512" y="448" font-size="19" fill="#d8efe2" font-weight="400" text-anchor="end" >2.95</text><text x="1576" y="448" font-size="15" fill="#ff7a6b" font-weight="700" text-anchor="start" >no supply left: full refund</text><rect x="60" y="468" width="1800" height="48" fill="#0e251a" stroke="#00ff66" stroke-width="1.5"/><text x="76" y="499" font-size="19" fill="#00ff66" font-weight="700" text-anchor="start" >TOTAL</text><text x="652" y="499" font-size="19" fill="#00ff66" font-weight="700" text-anchor="end" >12.87</text><text x="1082" y="499" font-size="19" fill="#00ff66" font-weight="700" text-anchor="end" >10</text><text x="1312" y="499" font-size="19" fill="#00ff66" font-weight="700" text-anchor="end" >6.80</text><text x="1512" y="499" font-size="19" fill="#00ff66" font-weight="700" text-anchor="end" >6.07</text><text x="1576" y="499" font-size="15" fill="#00ff66" font-weight="700" text-anchor="start" >6.80 + 6.07 = 12.87 ✓</text><text x="60" y="546" font-size="13" fill="#35c57a" font-weight="700" text-anchor="start" >SUPPLY: 10 LOTS ALLOCATED, THEN UNFILLED DEMAND</text><rect x="60" y="560" width="80" height="44" fill="#00ff66" opacity=".85"/><text x="66" y="587" font-size="12" fill="#001a0a" font-weight="700" text-anchor="start" >#1 @0.74</text><rect x="144" y="560" width="80" height="44" fill="#00ff66" opacity=".85"/><rect x="228" y="560" width="80" height="44" fill="#00ff66" opacity=".85"/><rect x="312" y="560" width="80" height="44" fill="#00ff66" opacity=".85"/><rect x="396" y="560" width="80" height="44" fill="#6cb6ff" opacity=".85"/><text x="402" y="587" font-size="12" fill="#001a0a" font-weight="700" text-anchor="start" >#2 @0.72</text><rect x="480" y="560" width="80" height="44" fill="#6cb6ff" opacity=".85"/><rect x="564" y="560" width="80" height="44" fill="#6cb6ff" opacity=".85"/><rect x="648" y="560" width="80" height="44" fill="#6cb6ff" opacity=".85"/><rect x="732" y="560" width="80" height="44" fill="#ffce73" opacity=".85"/><text x="738" y="587" font-size="12" fill="#001a0a" font-weight="700" text-anchor="start" >#3 @0.68</text><rect x="816" y="560" width="80" height="44" fill="#ffce73" opacity=".85"/><rect x="900" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="984" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1068" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1152" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1236" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1320" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1404" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1488" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1572" y="560" width="80" height="44" fill="none" stroke="#8fb09d" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="898" y1="552" x2="898" y2="612" stroke="#ff7a6b" stroke-width="2.5"/><text x="908" y="546" font-size="12" fill="#ff7a6b" font-weight="700" text-anchor="start" >supply exhausted: 10 of 10 lots sold</text><path d="M900 616 v6 H1228 v-6" fill="none" stroke="#8fb09d" stroke-width="1.5"/><text x="1064.0" y="640" font-size="12" fill="#8fb09d" font-weight="700" text-anchor="middle" >#3 unfilled: 4 lots @ 0.68</text><path d="M1236 616 v6 H1648 v-6" fill="none" stroke="#8fb09d" stroke-width="1.5"/><text x="1442.0" y="640" font-size="12" fill="#8fb09d" font-weight="700" text-anchor="middle" >#4 unfilled: 5 lots @ 0.59</text><text x="60" y="640" font-size="13" fill="#ffce73" font-weight="700" text-anchor="start" >clearing price 0.68 = limit of the last bid that got lots; all 10 lots pay 0.68</text><rect x="60" y="670" width="880" height="320" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="84" y="704" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >ALGORITHM (src/simulation.ts)</text><rect x="84" y="736" width="64" height="26" rx="4" fill="#00ff66"/><text x="116" y="754" font-size="12" fill="#001a0a" font-weight="700" text-anchor="middle" >SORT</text><text x="166" y="755" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >limit price descending; ties go to the lower commitment hash</text><rect x="84" y="794" width="64" height="26" rx="4" fill="#00ff66"/><text x="116" y="812" font-size="12" fill="#001a0a" font-weight="700" text-anchor="middle" >FILL</text><text x="166" y="813" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >walk the list: filled = min(remaining, requested) if limit &gt;= reserve</text><rect x="84" y="852" width="64" height="26" rx="4" fill="#00ff66"/><text x="116" y="870" font-size="12" fill="#001a0a" font-weight="700" text-anchor="middle" >PRICE</text><text x="166" y="871" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >supply exhausted: price = limit of last bid with lots; otherwise price = reserve</text><rect x="84" y="910" width="64" height="26" rx="4" fill="#00ff66"/><text x="116" y="928" font-size="12" fill="#001a0a" font-weight="700" text-anchor="middle" >SETTLE</text><text x="166" y="929" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >paid = price x filled lots;  refund = limit x requested - paid</text><rect x="980" y="670" width="880" height="320" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="1004" y="704" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >INVARIANTS AND EDGE CASES</text><text x="1004" y="734" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >CONSERVATION</text><text x="1004" y="754" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >paid + refund equals the original escrow for every bid, to the last zatoshi (unit-tested).</text><text x="1004" y="786" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >RESERVE</text><text x="1004" y="806" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >bids below 0.50 are never filled and get a full refund.</text><text x="1004" y="838" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >UNDERSUBSCRIBED</text><text x="1004" y="858" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >if supply is not exhausted, the price is the reserve (0.50), not the lowest bid.</text><text x="1004" y="890" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >ONE-SHOT</text><text x="1004" y="910" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >clear() runs once; the result object is frozen.</text><rect x="1004" y="930" width="832" height="50" rx="5" fill="#2a2108" stroke="#ffce73" stroke-width="1.5"/><text x="1018" y="951" font-size="12" fill="#ffce73" font-weight="400" text-anchor="start" >Design note: if one bid takes all supply it pays its own limit (no second-price discount).</text><text x="1018" y="971" font-size="12" fill="#ffce73" font-weight="400" text-anchor="start" >Vickrey is documented as a protocol option; this build implements uniform price only.</text>
