<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
<defs><marker id="m00ff66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ff66"/></marker><marker id="mffce73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffce73"/></marker><marker id="m8fb09d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb09d"/></marker><marker id="m6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker><marker id="mff7a6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f3a2b" stroke-width="2"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0a1f15" stroke-width="1"/></pattern></defs>
<rect width="1920" height="1080" fill="#050d09"/><rect width="1920" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="4" fill="#00ff66"/>
<text x="60" y="62" font-size="32" fill="#d8efe2" font-weight="700" text-anchor="start" >Anatomy of a bid: memo, URI and commitment</text><text x="60" y="92" font-size="16" fill="#82ab94" font-weight="400" text-anchor="start" >Exactly what is built for one bid (NODE07-001, 0.72 ZEC x 4 lots, testnet) and how large each part is.</text>
<line x1="60" y1="112" x2="1860" y2="112" stroke="#1f5a3a" stroke-width="1"/>

<rect x="60" y="140" width="900" height="526" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="84" y="174" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >A · CANONICAL BID MEMO (JSON, UTF-8)</text><text x="84" y="198" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >Real memo is one minified line; shown wrapped. Key order is fixed, so one bid has exactly one valid encoding.</text><rect x="84" y="212" width="6" height="40" fill="#6cb6ff"/><text x="104" y="230" font-size="15" fill="#6cb6ff" font-weight="700" text-anchor="start" >{"v":1,</text><text x="104" y="249" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >protocol version  ·  must equal 1</text><text x="930" y="236" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="end" >7 B</text><rect x="84" y="270" width="6" height="40" fill="#00ff66"/><text x="104" y="288" font-size="15" fill="#00ff66" font-weight="700" text-anchor="start" >"a":"NODE07-001",</text><text x="104" y="307" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >auction ID  ·  1-48 of A-Z a-z 0-9 _ -  (no ":")</text><text x="930" y="294" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="end" >17 B</text><rect x="84" y="328" width="6" height="40" fill="#ffce73"/><text x="104" y="346" font-size="15" fill="#ffce73" font-weight="700" text-anchor="start" >"p":"0.72",</text><text x="104" y="365" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >limit price, ZEC / lot  ·  canonical: positive, no trailing zeros</text><text x="930" y="352" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="end" >11 B</text><rect x="84" y="386" width="6" height="40" fill="#d58cff"/><text x="104" y="404" font-size="15" fill="#d58cff" font-weight="700" text-anchor="start" >"q":4,</text><text x="104" y="423" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >quantity, whole lots  ·  integer 1 to 999999</text><text x="930" y="410" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="end" >6 B</text><rect x="84" y="444" width="6" height="40" fill="#ff7a6b"/><text x="104" y="462" font-size="15" fill="#ff7a6b" font-weight="700" text-anchor="start" >"s":"&lt;64 hex chars&gt;",</text><text x="104" y="481" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >secret salt, 256 bit  ·  kept private, never reused</text><text x="930" y="468" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="end" >71 B</text><rect x="84" y="502" width="6" height="40" fill="#4fe3d0"/><text x="104" y="520" font-size="15" fill="#4fe3d0" font-weight="700" text-anchor="start" >"r":"utest18z20c...mehvvattdaemqljkrk4"}</text><text x="104" y="539" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >refund / settlement UA  ·  Orchard-only, network-matched</text><text x="930" y="526" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="end" >117 B</text><text x="84" y="588" font-size="12" fill="#35c57a" font-weight="700" text-anchor="start" >BYTE BUDGET · 229 of 512 bytes used (demo, testnet addresses)</text><rect x="84" y="592" width="852" height="26" fill="url(#hatch)" stroke="#1f5a3a" stroke-width="1.5"/><rect x="84.0" y="592" width="11.6" height="26" fill="#6cb6ff"/><rect x="95.6" y="592" width="28.3" height="26" fill="#00ff66"/><rect x="123.9" y="592" width="18.3" height="26" fill="#ffce73"/><rect x="142.2" y="592" width="10.0" height="26" fill="#d58cff"/><rect x="152.2" y="592" width="118.1" height="26" fill="#ff7a6b"/><rect x="270.4" y="592" width="194.7" height="26" fill="#4fe3d0"/><text x="936" y="638" font-size="12" fill="#82ab94" font-weight="400" text-anchor="end" >free: 283 B</text><text x="84" y="638" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >Audit runs on UTF-8 bytes before Base64url; unpaired surrogates are rejected.</text><rect x="1000" y="140" width="860" height="330" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="1024" y="174" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >B · ZIP-321 PAYMENT URI (440 characters for this bid)</text><rect x="1024" y="192" width="6" height="52" fill="#d8efe2"/><text x="1044" y="214" font-size="16" fill="#d8efe2" font-weight="700" text-anchor="start" >zcash:</text><text x="1044" y="236" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >URI scheme</text><rect x="1024" y="256" width="6" height="52" fill="#00ff66"/><text x="1044" y="278" font-size="16" fill="#00ff66" font-weight="700" text-anchor="start" >utest18z20cdj59zmjdl23hy...mehvvattdaemqljkrk4</text><text x="1044" y="300" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >vault address: Orchard-only UA, Bech32m + F4Jumble + point checked (110 chars)</text><rect x="1024" y="320" width="6" height="52" fill="#ffce73"/><text x="1044" y="342" font-size="16" fill="#ffce73" font-weight="700" text-anchor="start" >?amount=2.88</text><text x="1044" y="364" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >exact decimal ZEC = 0.72 x 4, BigInt zatoshis, never above 21,000,000 ZEC</text><rect x="1024" y="384" width="6" height="52" fill="#ff7a6b"/><text x="1044" y="406" font-size="16" fill="#ff7a6b" font-weight="700" text-anchor="start" >&amp;memo=&lt;Base64url of the memo&gt;</text><text x="1044" y="428" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >unpadded Base64url: + to -, / to _, = stripped (306 chars here)</text><rect x="1000" y="490" width="860" height="320" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="1024" y="524" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >C · COMMITMENT AND SALT</text><rect x="1024" y="540" width="812" height="74" rx="5" fill="#0e251a" stroke="#00ff66" stroke-width="1.5"/><text x="1040" y="568" font-size="16" fill="#00ff66" font-weight="700" text-anchor="start" >commitment = SHA-256( auctionId ":" price ":" qty ":" salt )</text><text x="1040" y="596" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >= 64 lowercase hex chars; the only bid-derived value that becomes public</text><text x="1024" y="646" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >salt = HMAC-SHA256( key = 32 random bytes,</text><text x="1024" y="670" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >              "DARKZEC/salt/v1:" + auctionId + ":" + nonce128 )</text><text x="1024" y="694" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >Entropy is wiped after use; a salt cannot be derived from public data.</text><text x="1024" y="718" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >Because ":" is banned in auction IDs, the preimage is unambiguous.</text><text x="1024" y="760" font-size="14" fill="#ffce73" font-weight="700" text-anchor="start" >The commitment binds auction, price, quantity and salt.</text><text x="1024" y="784" font-size="14" fill="#ffce73" font-weight="400" text-anchor="start" >It does NOT bind the refund address (see diagram 6).</text><rect x="60" y="684" width="900" height="130" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="84" y="714" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >D · INPUT RULES ENFORCED BEFORE ANYTHING IS BUILT</text><text x="84" y="738" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· Amounts: regex-checked decimals, max 8 places, no leading zeros, max 21,000,000 ZEC.</text><text x="84" y="758" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· Escrow = price x quantity in BigInt; above 21M ZEC is rejected.</text><text x="84" y="778" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· Address: lowercase, right network HRP, valid checksum, Orchard receiver only.</text><text x="84" y="798" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· Memo: canonical JSON round-trip; any extra key or reordering is refused.</text><rect x="60" y="830" width="1800" height="170" rx="8" fill="#2a1410" stroke="#ff7a6b" stroke-width="2.5"/><text x="90" y="872" font-size="20" fill="#ff7a6b" font-weight="700" text-anchor="start" >BASE64URL IS ENCODING, NOT ENCRYPTION</text><text x="90" y="908" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Anyone who sees this URI can read the price, quantity, salt and refund address. It is a sensitive plaintext payment instruction.</text><text x="90" y="934" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >Share it only with a trusted Orchard-capable wallet. The wallet performs the real note and memo encryption when it builds the shielded transaction.</text><text x="90" y="960" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >DarkZec reveals the URI only on request, never logs it, and wipes the interface copy on edit, view switch and page exit (browser/OS copies cannot be guaranteed wiped).</text>
<line x1="60" y1="1040" x2="1860" y2="1040" stroke="#1f5a3a" stroke-width="1"/>
<text x="60" y="1066" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >DARKZEC / NODE 07  ·  ZECATHON PRIVATE MARKETS  ·  local sandbox + ZIP-321 request builder</text><text x="1860" y="1066" font-size="13" fill="#35c57a" font-weight="700" text-anchor="end" >DIAGRAM 3 / 6</text>
</svg>