<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
<defs><marker id="m00ff66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ff66"/></marker><marker id="mffce73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffce73"/></marker><marker id="m8fb09d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb09d"/></marker><marker id="m6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker><marker id="mff7a6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f3a2b" stroke-width="2"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0a1f15" stroke-width="1"/></pattern></defs>
<rect width="1920" height="1080" fill="#050d09"/><rect width="1920" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="4" fill="#00ff66"/>
<text x="60" y="62" font-size="32" fill="#d8efe2" font-weight="700" text-anchor="start" >Verifiable audit: Merkle inclusion proof</text><text x="60" y="92" font-size="16" fill="#82ab94" font-weight="400" text-anchor="start" >How a bidder proves that their commitment is in the frozen set, without revealing the bid.</text>
<line x1="60" y1="112" x2="1860" y2="112" stroke="#1f5a3a" stroke-width="1"/>

<line x1="185" y1="700" x2="185" y2="628" stroke="#2c6a47" stroke-width="2"/><line x1="455" y1="700" x2="455" y2="628" stroke="#2c6a47" stroke-width="2"/><line x1="725" y1="700" x2="725" y2="628" stroke="#2c6a47" stroke-width="2"/><line x1="995" y1="700" x2="995" y2="628" stroke="#ffce73" stroke-width="3.5"/><line x1="185" y1="570" x2="320" y2="488" stroke="#2c6a47" stroke-width="2"/><line x1="455" y1="570" x2="320" y2="488" stroke="#2c6a47" stroke-width="2"/><line x1="725" y1="570" x2="860" y2="488" stroke="#2c6a47" stroke-width="2"/><line x1="995" y1="570" x2="860" y2="488" stroke="#ffce73" stroke-width="3.5"/><line x1="320" y1="430" x2="590" y2="348" stroke="#2c6a47" stroke-width="2"/><line x1="860" y1="430" x2="590" y2="348" stroke="#ffce73" stroke-width="3.5"/><line x1="590" y1="290" x2="590" y2="208" stroke="#ffce73" stroke-width="3.5"/><line x1="725" y1="570" x2="860" y2="488" stroke="#6cb6ff" stroke-width="3"/><line x1="320" y1="430" x2="590" y2="348" stroke="#6cb6ff" stroke-width="3"/><rect x="400.0" y="150" width="380" height="58" rx="5" fill="#0e251a" stroke="#ffce73" stroke-width="3"/><text x="590" y="175.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >root = SHA-256(0x02 || uint64be(4) || R)</text><text x="590" y="195.0" font-size="11" fill="#82ab94" font-weight="400" text-anchor="middle" >published Merkle root</text><rect x="440.0" y="290" width="300" height="58" rx="5" fill="#0a1a12" stroke="#ffce73" stroke-width="3"/><text x="590" y="324.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >R = SHA-256(0x01 || P12 || P34)</text><rect x="170.0" y="430" width="300" height="58" rx="5" fill="#0a1a12" stroke="#6cb6ff" stroke-width="3"/><text x="320" y="464.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >P12 = SHA-256(0x01 || L1 || L2)</text><rect x="710.0" y="430" width="300" height="58" rx="5" fill="#0a1a12" stroke="#ffce73" stroke-width="3"/><text x="860" y="464.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >P34 = SHA-256(0x01 || L3 || L4)</text><rect x="60.0" y="570" width="250" height="58" rx="5" fill="#0a1a12" stroke="#2c6a47" stroke-width="2"/><text x="185" y="604.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >L1 = SHA-256(0x00 || c1)</text><rect x="60.0" y="700" width="250" height="52" rx="5" fill="#0e251a" stroke="#2c6a47" stroke-width="2"/><text x="185" y="722.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >c1</text><text x="185" y="742.0" font-size="11" fill="#82ab94" font-weight="400" text-anchor="middle" >public commitment, entry 1</text><rect x="330.0" y="570" width="250" height="58" rx="5" fill="#0a1a12" stroke="#2c6a47" stroke-width="2"/><text x="455" y="604.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >L2 = SHA-256(0x00 || c2)</text><rect x="330.0" y="700" width="250" height="52" rx="5" fill="#0e251a" stroke="#2c6a47" stroke-width="2"/><text x="455" y="722.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >c2</text><text x="455" y="742.0" font-size="11" fill="#82ab94" font-weight="400" text-anchor="middle" >public commitment, entry 2</text><rect x="600.0" y="570" width="250" height="58" rx="5" fill="#0a1a12" stroke="#6cb6ff" stroke-width="3"/><text x="725" y="604.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >L3 = SHA-256(0x00 || c3)</text><rect x="600.0" y="700" width="250" height="52" rx="5" fill="#0e251a" stroke="#2c6a47" stroke-width="2"/><text x="725" y="722.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >c3</text><text x="725" y="742.0" font-size="11" fill="#82ab94" font-weight="400" text-anchor="middle" >public commitment, entry 3</text><rect x="870.0" y="570" width="250" height="58" rx="5" fill="#0a1a12" stroke="#ffce73" stroke-width="3"/><text x="995" y="604.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >L4 = SHA-256(0x00 || c4)</text><rect x="870.0" y="700" width="250" height="52" rx="5" fill="#0e251a" stroke="#ffce73" stroke-width="3"/><text x="995" y="722.0" font-size="13" fill="#d8efe2" font-weight="700" text-anchor="middle" >c4</text><text x="995" y="742.0" font-size="11" fill="#82ab94" font-weight="400" text-anchor="middle" >public commitment, entry 4 (mine)</text><circle cx="600" cy="570" r="13" fill="#6cb6ff"/><text x="600" y="575" font-size="14" fill="#001a2a" font-weight="700" text-anchor="middle" >1</text><circle cx="170" cy="430" r="13" fill="#6cb6ff"/><text x="170" y="435" font-size="14" fill="#001a2a" font-weight="700" text-anchor="middle" >2</text><rect x="60" y="790" width="1060" height="196" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="84" y="822" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >HOW ENTRY 4 IS VERIFIED (4 commitments, 2 levels)</text><text x="84" y="852" font-size="14" fill="#ffce73" font-weight="400" text-anchor="start" >■ amber: values the verifier recomputes from its own commitment c4</text><text x="84" y="882" font-size="14" fill="#6cb6ff" font-weight="400" text-anchor="start" >■ blue + numbers: sibling hashes supplied in the proof (step 1 = L3, step 2 = P12)</text><text x="84" y="912" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >→ h = L4;  h = SHA-256(0x01 || L3 || h);  h = SHA-256(0x01 || P12 || h)</text><text x="84" y="942" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >→ accept only if SHA-256(0x02 || uint64be(4) || h) equals the published root</text><rect x="1150" y="140" width="710" height="214" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="1172" y="172" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >HASH RULES (domain separation)</text><text x="1172" y="206" font-size="13" fill="#ffce73" font-weight="700" text-anchor="start" >leaf</text><text x="1280" y="206" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >SHA-256(0x00 || commitment bytes)</text><text x="1172" y="232" font-size="13" fill="#ffce73" font-weight="700" text-anchor="start" >parent</text><text x="1280" y="232" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >SHA-256(0x01 || left || right)</text><text x="1172" y="258" font-size="13" fill="#ffce73" font-weight="700" text-anchor="start" >odd node</text><text x="1280" y="258" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >the last node of a level pairs with itself</text><text x="1172" y="284" font-size="13" fill="#ffce73" font-weight="700" text-anchor="start" >root</text><text x="1280" y="284" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >SHA-256(0x02 || uint64be(count) || top hash)</text><text x="1172" y="310" font-size="13" fill="#ffce73" font-weight="700" text-anchor="start" >empty</text><text x="1280" y="310" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >SHA-256("DARKZEC/merkle/empty/v1")</text><text x="1172" y="342" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >Prefixes stop leaf/parent confusion; the count stops 3 leaves posing as 4.</text><rect x="1150" y="374" width="710" height="200" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="1172" y="406" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >PROOF OBJECT FOR ENTRY 4</text><text x="1172" y="444" font-size="15" fill="#00ff66" font-weight="700" text-anchor="start" >{ index: 3,  count: 4,</text><text x="1172" y="468" font-size="15" fill="#00ff66" font-weight="700" text-anchor="start" >  steps: [ { hash: L3,  side: "left" },</text><text x="1172" y="492" font-size="15" fill="#00ff66" font-weight="700" text-anchor="start" >           { hash: P12, side: "left" } ] }</text><text x="1172" y="522" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >Hashes only: no price, salt, memo or address is exposed.</text><text x="1172" y="544" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >side is fixed by index parity, so a proof cannot be mirrored.</text><rect x="1150" y="594" width="710" height="186" rx="8" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><text x="1172" y="626" font-size="14" fill="#35c57a" font-weight="700" text-anchor="start" >VERIFIER CHECKS (verifyProof)</text><text x="1172" y="652" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >1  0 &lt;= index &lt; count, and every hash is 64 lowercase hex</text><text x="1172" y="678" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >2  step side must match the position parity (odd = left)</text><text x="1172" y="704" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >3  exactly ceil(log2(count)) steps for this tree size</text><text x="1172" y="730" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >4  odd last node: its sibling must equal itself</text><text x="1172" y="756" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >5  final hash must equal the published root</text><rect x="1150" y="800" width="710" height="186" rx="8" fill="#0a1a12" stroke="#ffce73" stroke-width="2"/><text x="1172" y="832" font-size="14" fill="#ffce73" font-weight="700" text-anchor="start" >WHAT THIS DOES NOT PROVE</text><text x="1172" y="860" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· Membership only: not that clearing was fair or that payment arrived.</text><text x="1172" y="886" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· The root is local here; production needs a root published or anchored</text><text x="1172" y="912" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· somewhere the operator cannot rewrite.</text><text x="1172" y="938" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >· Without anchoring an operator could still omit a bid before freezing.</text>
<line x1="60" y1="1040" x2="1860" y2="1040" stroke="#1f5a3a" stroke-width="1"/>
<text x="60" y="1066" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >DARKZEC / NODE 07  ·  ZECATHON PRIVATE MARKETS  ·  local sandbox + ZIP-321 request builder</text><text x="1860" y="1066" font-size="13" fill="#35c57a" font-weight="700" text-anchor="end" >DIAGRAM 5 / 6</text>
</svg>