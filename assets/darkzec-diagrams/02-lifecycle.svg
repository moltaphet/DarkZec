<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
<defs><marker id="m00ff66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ff66"/></marker><marker id="mffce73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffce73"/></marker><marker id="m8fb09d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb09d"/></marker><marker id="m6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker><marker id="mff7a6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f3a2b" stroke-width="2"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0a1f15" stroke-width="1"/></pattern></defs>
<rect width="1920" height="1080" fill="#050d09"/><rect width="1920" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="4" fill="#00ff66"/>
<text x="60" y="62" font-size="32" fill="#d8efe2" font-weight="700" text-anchor="start" >Auction lifecycle and guarded transitions</text><text x="60" y="92" font-size="16" fill="#82ab94" font-weight="400" text-anchor="start" >Three phases, two one-way transitions, and the validation gate every bid passes before it is sealed.</text>
<line x1="60" y1="112" x2="1860" y2="112" stroke="#1f5a3a" stroke-width="1"/>

<rect x="60" y="150" width="540" height="360" rx="8" fill="#0a1a12" stroke="#00ff66" stroke-width="2.5"/><rect x="60" y="150" width="540" height="48" rx="8" fill="#00ff66" opacity=".16"/><text x="80" y="182" font-size="19" fill="#00ff66" font-weight="700" text-anchor="start" >PHASE 1 · OPEN</text><text x="80" y="228" font-size="12" fill="#00ff66" font-weight="700" text-anchor="start" >ALLOWED</text><text x="80" y="250" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· submit(prepared), one at a time (busy lock)</text><text x="80" y="272" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· up to 128 bids; duplicates refused</text><text x="80" y="306" font-size="12" fill="#6cb6ff" font-weight="700" text-anchor="start" >PUBLIC VIEW</text><text x="80" y="328" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· commitment hashes in submission order</text><text x="80" y="362" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >SEALED</text><text x="80" y="384" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· prices, quantities, salts, refund addresses</text><text x="80" y="418" font-size="12" fill="#ff7a6b" font-weight="700" text-anchor="start" >REFUSED</text><text x="80" y="440" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· audit(): "Close the auction to freeze its audit root"</text><text x="80" y="462" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· clear(): "Close the auction before unsealing"</text><rect x="690" y="150" width="540" height="360" rx="8" fill="#0a1a12" stroke="#ffce73" stroke-width="2.5"/><rect x="690" y="150" width="540" height="48" rx="8" fill="#ffce73" opacity=".16"/><text x="710" y="182" font-size="19" fill="#ffce73" font-weight="700" text-anchor="start" >PHASE 2 · CLOSED</text><text x="710" y="228" font-size="12" fill="#00ff66" font-weight="700" text-anchor="start" >ALLOWED</text><text x="710" y="250" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· audit(i): commitment + Merkle root + proof</text><text x="710" y="272" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· verifyProof(): recomputes the root locally</text><text x="710" y="294" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· clear(): decrypt, verify, allocate</text><text x="710" y="328" font-size="12" fill="#6cb6ff" font-weight="700" text-anchor="start" >PUBLIC VIEW</text><text x="710" y="350" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· same list, frozen; the root cannot change</text><text x="710" y="384" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >SEALED</text><text x="710" y="406" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· contents stay encrypted until clear()</text><text x="710" y="440" font-size="12" fill="#ff7a6b" font-weight="700" text-anchor="start" >REFUSED</text><text x="710" y="462" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· submit(): "The auction is closed."</text><rect x="1320" y="150" width="540" height="360" rx="8" fill="#0a1a12" stroke="#6cb6ff" stroke-width="2.5"/><rect x="1320" y="150" width="540" height="48" rx="8" fill="#6cb6ff" opacity=".16"/><text x="1340" y="182" font-size="19" fill="#6cb6ff" font-weight="700" text-anchor="start" >PHASE 3 · CLEARED</text><text x="1340" y="228" font-size="12" fill="#00ff66" font-weight="700" text-anchor="start" >ALLOWED</text><text x="1340" y="250" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· audit(i): same root as before clearing</text><text x="1340" y="284" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >REVEALED ON SCREEN (DEMO)</text><text x="1340" y="306" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· clearing price, lots filled</text><text x="1340" y="328" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· per-entry limit, paid and refund</text><text x="1340" y="362" font-size="12" fill="#ffce73" font-weight="700" text-anchor="start" >NOT DISPLAYED</text><text x="1340" y="384" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· salts and refund addresses stay in the vault</text><text x="1340" y="418" font-size="12" fill="#ff7a6b" font-weight="700" text-anchor="start" >REFUSED</text><text x="1340" y="440" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· clear(): "Auction has already cleared."</text><text x="1340" y="462" font-size="14" fill="#d8efe2" font-weight="400" text-anchor="start" >· submit(): closed; result is immutable</text><path d="M600 330 L690 330" fill="none" stroke="#ffce73" stroke-width="2.5" marker-end="url(#mffce73)" stroke-linejoin="round"/><text x="645" y="318" font-size="14" fill="#ffce73" font-weight="700" text-anchor="middle" >close()</text><path d="M1230 330 L1320 330" fill="none" stroke="#6cb6ff" stroke-width="2.5" marker-end="url(#m6cb6ff)" stroke-linejoin="round"/><text x="1275" y="318" font-size="14" fill="#6cb6ff" font-weight="700" text-anchor="middle" >clear()</text><text x="60" y="548" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >close() is refused while an operation is in progress.  Reset local session: new AES key, empty book, back to PHASE 1.  Reload discards everything.</text><text x="60" y="600" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >submit() GUARD: ten checks, in this order, must all pass before a bid is sealed</text><rect x="60" y="625" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="74" y="641" width="30" height="26" rx="4" fill="#00ff66"/><text x="89" y="660" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >1</text><text x="116" y="661" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Vault idle</text><text x="76" y="697" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >no other operation in progress</text><rect x="420" y="625" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="434" y="641" width="30" height="26" rx="4" fill="#00ff66"/><text x="449" y="660" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >2</text><text x="476" y="661" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Phase = OPEN</text><text x="436" y="697" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >else: The auction is closed.</text><rect x="780" y="625" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="794" y="641" width="30" height="26" rx="4" fill="#00ff66"/><text x="809" y="660" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >3</text><text x="836" y="661" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Capacity</text><text x="796" y="697" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >fewer than 128 bids</text><rect x="1140" y="625" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="1154" y="641" width="30" height="26" rx="4" fill="#00ff66"/><text x="1169" y="660" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >4</text><text x="1196" y="661" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Memo valid</text><text x="1156" y="697" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >canonical JSON, &lt;= 512 B, Orchard UA</text><rect x="1500" y="625" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="1514" y="641" width="30" height="26" rx="4" fill="#00ff66"/><text x="1529" y="660" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >5</text><text x="1556" y="661" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Right auction</text><text x="1516" y="697" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >memo auction ID = vault ID</text><rect x="60" y="750" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="74" y="766" width="30" height="26" rx="4" fill="#00ff66"/><text x="89" y="785" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >6</text><text x="116" y="786" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Commitment</text><text x="76" y="822" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >recomputed hash equals claimed</text><rect x="420" y="750" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="434" y="766" width="30" height="26" rx="4" fill="#00ff66"/><text x="449" y="785" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >7</text><text x="476" y="786" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Not duplicate</text><text x="436" y="822" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >commitment not already sealed</text><rect x="780" y="750" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="794" y="766" width="30" height="26" rx="4" fill="#00ff66"/><text x="809" y="785" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >8</text><text x="836" y="786" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Escrow</text><text x="796" y="822" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >amount = price x quantity exactly</text><rect x="1140" y="750" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="1154" y="766" width="30" height="26" rx="4" fill="#00ff66"/><text x="1169" y="785" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >9</text><text x="1196" y="786" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Payment URI</text><text x="1156" y="822" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >rebuilt byte-for-byte, must match</text><rect x="1500" y="750" width="340" height="105" rx="6" fill="#0a1a12" stroke="#1f5a3a" stroke-width="2"/><rect x="1514" y="766" width="30" height="26" rx="4" fill="#00ff66"/><text x="1529" y="785" font-size="15" fill="#001a0a" font-weight="700" text-anchor="middle" >10</text><text x="1556" y="786" font-size="17" fill="#d8efe2" font-weight="700" text-anchor="start" >Byte audit</text><text x="1516" y="822" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >memo length equals reported length</text><rect x="60" y="885" width="1800" height="66" rx="6" fill="#0e251a" stroke="#00ff66" stroke-width="2.5"/><text x="84" y="914" font-size="17" fill="#00ff66" font-weight="700" text-anchor="start" >SEAL</text><text x="160" y="914" font-size="16" fill="#d8efe2" font-weight="400" text-anchor="start" >AES-256-GCM encrypt: fresh 96-bit IV, non-extractable key, AAD = commitment.</text><text x="160" y="938" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >Only the commitment hash becomes public; the plaintext memo buffer is zeroed after encryption.</text><path d="M960 857 L960 885" fill="none" stroke="#00ff66" stroke-width="2.5" marker-end="url(#m00ff66)" stroke-linejoin="round"/>
<line x1="60" y1="1040" x2="1860" y2="1040" stroke="#1f5a3a" stroke-width="1"/>
<text x="60" y="1066" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >DARKZEC / NODE 07  ·  ZECATHON PRIVATE MARKETS  ·  local sandbox + ZIP-321 request builder</text><text x="1860" y="1066" font-size="13" fill="#35c57a" font-weight="700" text-anchor="end" >DIAGRAM 2 / 6</text>
</svg>