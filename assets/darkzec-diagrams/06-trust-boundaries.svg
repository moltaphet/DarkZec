<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
<defs><marker id="m00ff66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ff66"/></marker><marker id="mffce73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffce73"/></marker><marker id="m8fb09d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb09d"/></marker><marker id="m6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker><marker id="mff7a6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f3a2b" stroke-width="2"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0a1f15" stroke-width="1"/></pattern></defs>
<rect width="1920" height="1080" fill="#050d09"/><rect width="1920" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="4" fill="#00ff66"/>
<text x="60" y="62" font-size="32" fill="#d8efe2" font-weight="700" text-anchor="start" >Trust boundaries: who can see what</text><text x="60" y="92" font-size="16" fill="#82ab94" font-weight="400" text-anchor="start" >Visibility of every piece of bid data to each party. Sealed means sealed from the public, not from the vault operator.</text>
<line x1="60" y1="112" x2="1860" y2="112" stroke="#1f5a3a" stroke-width="1"/>

<rect x="60" y="136" width="1800" height="74" fill="#0e251a" stroke="#1f5a3a" stroke-width="1.5"/><text x="80" y="178" font-size="13" fill="#35c57a" font-weight="700" text-anchor="start" >DATA ITEM</text><text x="486" y="168" font-size="14" fill="#d8efe2" font-weight="700" text-anchor="start" >PUBLIC OBSERVERS</text><text x="486" y="190" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >chain + published book</text><text x="831" y="168" font-size="14" fill="#d8efe2" font-weight="700" text-anchor="start" >BIDDER'S WALLET APP</text><text x="831" y="190" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >trusted, on bidder device</text><text x="1176" y="168" font-size="14" fill="#d8efe2" font-weight="700" text-anchor="start" >VAULT OPERATOR</text><text x="1176" y="190" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >holds the viewing key (IVK)</text><text x="1521" y="168" font-size="14" fill="#d8efe2" font-weight="700" text-anchor="start" >THE BIDDER</text><text x="1521" y="190" font-size="12" fill="#82ab94" font-weight="400" text-anchor="start" >you</text><rect x="60" y="210" width="1800" height="62" fill="#0a1a12" stroke="#12301f" stroke-width="1"/><text x="80" y="247" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Commitment hash</text><circle cx="498" cy="241" r="9" fill="#ffce73"/><text x="520" y="246" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >listed in the sealed book</text><circle cx="843" cy="241" r="8" fill="none" stroke="#6cb6ff" stroke-width="2.5"/><path d="M843 233 A8 8 0 0 1 843 249Z" fill="#6cb6ff"/><text x="865" y="246" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >derivable from the URI</text><circle cx="1188" cy="241" r="9" fill="#ffce73"/><text x="1210" y="246" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >computes and lists it</text><circle cx="1533" cy="241" r="9" fill="#ffce73"/><text x="1555" y="246" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >knows own bid + salt</text><rect x="60" y="272" width="1800" height="62" fill="#07140d" stroke="#12301f" stroke-width="1"/><text x="80" y="309" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Limit price and quantity</text><circle cx="498" cy="303" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="520" y="308" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >sealed until clear (demo shows)</text><circle cx="843" cy="303" r="9" fill="#ffce73"/><text x="865" y="308" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >plain in the memo</text><circle cx="1188" cy="303" r="9" fill="#ffce73"/><text x="1210" y="308" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >after IVK decryption</text><circle cx="1533" cy="303" r="9" fill="#ffce73"/><text x="1555" y="308" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >chose them</text><rect x="60" y="334" width="1800" height="62" fill="#0a1a12" stroke="#12301f" stroke-width="1"/><text x="80" y="371" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Salt</text><circle cx="498" cy="365" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="520" y="370" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >never published</text><circle cx="843" cy="365" r="9" fill="#ffce73"/><text x="865" y="370" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >plain in the memo</text><circle cx="1188" cy="365" r="9" fill="#ffce73"/><text x="1210" y="370" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >after IVK decryption</text><circle cx="1533" cy="365" r="9" fill="#ffce73"/><text x="1555" y="370" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >generated locally</text><rect x="60" y="396" width="1800" height="62" fill="#07140d" stroke="#12301f" stroke-width="1"/><text x="80" y="433" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Refund address</text><circle cx="498" cy="427" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="520" y="432" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >never published</text><circle cx="843" cy="427" r="9" fill="#ffce73"/><text x="865" y="432" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >plain in the memo</text><circle cx="1188" cy="427" r="9" fill="#ffce73"/><text x="1210" y="432" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >after IVK decryption</text><circle cx="1533" cy="427" r="9" fill="#ffce73"/><text x="1555" y="432" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >own address</text><rect x="60" y="458" width="1800" height="62" fill="#0a1a12" stroke="#12301f" stroke-width="1"/><text x="80" y="495" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Escrow amount</text><circle cx="498" cy="489" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="520" y="494" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >hidden by Orchard shielding</text><circle cx="843" cy="489" r="9" fill="#ffce73"/><text x="865" y="494" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >builds the payment</text><circle cx="1188" cy="489" r="9" fill="#ffce73"/><text x="1210" y="494" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >sees the received note</text><circle cx="1533" cy="489" r="9" fill="#ffce73"/><text x="1555" y="494" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >price x quantity</text><rect x="60" y="520" width="1800" height="62" fill="#07140d" stroke="#12301f" stroke-width="1"/><text x="80" y="557" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Full payment URI</text><circle cx="498" cy="551" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="520" y="556" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >never on chain</text><circle cx="843" cy="551" r="9" fill="#ffce73"/><text x="865" y="556" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >receives it from you</text><circle cx="1188" cy="551" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="1210" y="556" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >gets the note, not the URI</text><circle cx="1533" cy="551" r="9" fill="#ffce73"/><text x="1555" y="556" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >clipboard / history risk</text><rect x="60" y="582" width="1800" height="62" fill="#0a1a12" stroke="#12301f" stroke-width="1"/><text x="80" y="619" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Merkle root + proof</text><circle cx="498" cy="613" r="9" fill="#ffce73"/><text x="520" y="618" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >once published (local in demo)</text><circle cx="843" cy="613" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="865" y="618" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >not involved</text><circle cx="1188" cy="613" r="9" fill="#ffce73"/><text x="1210" y="618" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >builds and freezes it</text><circle cx="1533" cy="613" r="9" fill="#ffce73"/><text x="1555" y="618" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >can verify own entry</text><rect x="60" y="644" width="1800" height="62" fill="#07140d" stroke="#12301f" stroke-width="1"/><text x="80" y="681" font-size="15" fill="#d8efe2" font-weight="700" text-anchor="start" >Timing and size metadata</text><circle cx="498" cy="675" r="8" fill="none" stroke="#6cb6ff" stroke-width="2.5"/><path d="M498 667 A8 8 0 0 1 498 683Z" fill="#6cb6ff"/><text x="520" y="680" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >shielded tx timing and size</text><circle cx="843" cy="675" r="9" fill="#ffce73"/><text x="865" y="680" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >knows when you paid</text><circle cx="1188" cy="675" r="8" fill="none" stroke="#6cb6ff" stroke-width="2.5"/><path d="M1188 667 A8 8 0 0 1 1188 683Z" fill="#6cb6ff"/><text x="1210" y="680" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >knows when a note arrived</text><circle cx="1533" cy="675" r="9" fill="#ffce73"/><text x="1555" y="680" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >knows when you paid</text><circle cx="80" cy="730" r="9" fill="#ffce73"/><text x="98" y="735" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >sees it</text><circle cx="200" cy="730" r="8" fill="none" stroke="#6cb6ff" stroke-width="2.5"/><path d="M200 722 A8 8 0 0 1 200 738Z" fill="#6cb6ff"/><text x="218" y="735" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >sees part / can derive it</text><circle cx="470" cy="730" r="8" fill="none" stroke="#35c57a" stroke-width="2.5"/><text x="488" y="735" font-size="13" fill="#d8efe2" font-weight="400" text-anchor="start" >cannot see it</text><text x="1860" y="735" font-size="13" fill="#82ab94" font-weight="400" text-anchor="end" >Production design view; the sandbox plays the operator inside the browser.</text><rect x="60" y="768" width="580" height="242" rx="8" fill="#0a1a12" stroke="#ffce73" stroke-width="2.5"/><text x="80" y="802" font-size="15" fill="#ffce73" font-weight="700" text-anchor="start" >SEALED IS NOT SECRET FROM THE OPERATOR</text><text x="80" y="834" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >The viewing-key holder reads every bid on arrival. The book</text><text x="80" y="858" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >is sealed toward the public only.</text><text x="80" y="936" font-size="12" fill="#35c57a" font-weight="700" text-anchor="start" >MITIGATION</text><text x="80" y="958" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >Restrict viewing-key authority, publish disclosure rules and</text><text x="80" y="980" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >anchor the root.</text><rect x="670" y="768" width="580" height="242" rx="8" fill="#0a1a12" stroke="#ff7a6b" stroke-width="2.5"/><text x="690" y="802" font-size="15" fill="#ff7a6b" font-weight="700" text-anchor="start" >THE URI IS THE MOST SENSITIVE ARTIFACT</text><text x="690" y="834" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >It carries price, quantity, salt and refund address in</text><text x="690" y="858" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >readable Base64url. Clipboard and history cannot be</text><text x="690" y="882" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >reliably erased.</text><text x="690" y="936" font-size="12" fill="#35c57a" font-weight="700" text-anchor="start" >MITIGATION</text><text x="690" y="958" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >Give it only to a trusted wallet; verify address and amount</text><text x="690" y="980" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >there; clear the clipboard.</text><rect x="1280" y="768" width="580" height="242" rx="8" fill="#0a1a12" stroke="#6cb6ff" stroke-width="2.5"/><text x="1300" y="802" font-size="15" fill="#6cb6ff" font-weight="700" text-anchor="start" >SHIELDED IS NOT METADATA-FREE</text><text x="1300" y="834" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >Orchard hides amounts, memos and addresses on chain.</text><text x="1300" y="858" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >Timing, size and device compromise remain. This app has no</text><text x="1300" y="882" font-size="15" fill="#d8efe2" font-weight="400" text-anchor="start" >RPC and tracks no payment status.</text><text x="1300" y="936" font-size="12" fill="#35c57a" font-weight="700" text-anchor="start" >MITIGATION</text><text x="1300" y="958" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >Bid from a clean device; treat timing correlation as residual</text><text x="1300" y="980" font-size="14" fill="#82ab94" font-weight="400" text-anchor="start" >risk.</text>
<line x1="60" y1="1040" x2="1860" y2="1040" stroke="#1f5a3a" stroke-width="1"/>
<text x="60" y="1066" font-size="13" fill="#82ab94" font-weight="400" text-anchor="start" >DARKZEC / NODE 07  ·  ZECATHON PRIVATE MARKETS  ·  local sandbox + ZIP-321 request builder</text><text x="1860" y="1066" font-size="13" fill="#35c57a" font-weight="700" text-anchor="end" >DIAGRAM 6 / 6</text>
</svg>